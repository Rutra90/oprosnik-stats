<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#face30">
<title>Опрос клиники — статистика</title>
<style>
  :root{
    --accent:#face30; --text:#222; --muted:#7a7a7a; --line:#e6e6e6;
    --bg:#f2f3f5; --card:#fff; --pos:#1b7f1b; --posbg:#d9f2d9;
    --neg:#b3261e; --negbg:#f9d6d5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border-radius:14px;padding:13px 15px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
  .kpi .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-size:26px;font-weight:700;margin-top:3px}
  .kpi.pos .v{color:var(--pos)}
  .kpi.neg .v{color:var(--neg)}
  .panel{background:var(--card);border-radius:14px;padding:15px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.07)}
  .panel h2{font-size:15px;margin:0 0 10px}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:26px 1fr 38px;gap:9px;align-items:center;font-size:13px}
  .bar .track{height:12px;border-radius:99px;background:#eee;overflow:hidden}
  .bar .fill{height:100%;border-radius:99px;background:#bdbdbd}
  .bar.pos .fill{background:var(--pos)}
  .bar.neg .fill{background:var(--neg)}
  .bar .n{text-align:right;color:var(--muted);font-size:12px}
  .q{margin-bottom:13px}
  .q .qt{font-weight:600;margin-bottom:5px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{background:#f4f4f4;border-radius:99px;padding:4px 9px;font-size:12px}
  .chip b{font-weight:700}
  .resp{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
  .resp:first-child{border-top:none}
  .score{flex:0 0 auto;width:36px;height:36px;border-radius:9px;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:16px}
  .score.pos{background:var(--posbg);color:var(--pos)}
  .score.neg{background:var(--negbg);color:var(--neg)}
  .resp .meta{font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:20px}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Опрос клиники — статистика</h1>
  <div class="sub" id="sub">Загрузка…</div>

  <div id="content" class="hide">
    <div class="cards" id="kpis"></div>

    <div class="panel">
      <h2>Распределение оценок</h2>
      <div class="bars" id="dist"></div>
    </div>

    <div class="panel">
      <h2>Ответы по вопросам</h2>
      <div id="questions"></div>
    </div>

    <div class="panel">
      <h2>Последние прохождения</h2>
      <div id="recent"></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString('ru-RU', {
    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

function render(s) {
  $('#sub').textContent = 'Обновлено: ' + fmtDate(s.generatedAt) +
    ' · прохождений: ' + s.total;

  const kpis = [
    { t: 'Всего прохождений', v: s.total },
    { t: 'Средний рейтинг', v: s.avgRating ? s.avgRating.toFixed(2) : '—',
      cls: s.avgRating >= s.positiveMin ? 'pos' : 'neg' },
    { t: 'Положительных (≥ ' + s.positiveMin + ')', v: s.positive, cls: 'pos' },
    { t: 'Отрицательных (< ' + s.positiveMin + ')', v: s.negative, cls: 'neg' },
    { t: 'Первый раз — средний', v: s.avgFirst ? s.avgFirst.toFixed(2) : '—' },
    { t: 'Повторно — средний', v: s.avgRepeat ? s.avgRepeat.toFixed(2) : '—' }
  ];
  $('#kpis').innerHTML = kpis.map((k) =>
    '<div class="kpi ' + (k.cls || '') + '"><div class="t">' + esc(k.t) +
    '</div><div class="v">' + esc(k.v) + '</div></div>').join('');

  const dist = s.dist || {};
  const maxD = Math.max(1, ...Object.values(dist).map(Number));
  $('#dist').innerHTML = Object.keys(dist).map((k) => {
    const n = Number(dist[k]) || 0;
    const cls = Number(k) >= s.positiveMin ? 'pos' : 'neg';
    return '<div class="bar ' + cls + '"><div>' + esc(k) + '</div>' +
      '<div class="track"><div class="fill" style="width:' + (n / maxD * 100) + '%"></div></div>' +
      '<div class="n">' + n + '</div></div>';
  }).join('');

  $('#questions').innerHTML = (s.questions || []).map((item) =>
    '<div class="q"><div class="qt">' + esc(item.q) + '</div><div class="chips">' +
    item.items.slice(0, 12).map((x) =>
      '<span class="chip">' + esc(x.value) + ' <b>' + x.count + '</b></span>').join('') +
    '</div></div>').join('') || '<div class="empty">Пока нет ответов</div>';

  $('#recent').innerHTML = (s.recent || []).map((r) => {
    const cls = r.rating != null && r.rating >= s.positiveMin ? 'pos' : 'neg';
    return '<div class="resp"><div class="score ' + cls + '">' +
      (r.rating == null ? '—' : r.rating) + '</div>' +
      '<div class="meta">' + esc(fmtDate(r.date)) + ' · ' + esc(r.branch) + '</div></div>';
  }).join('') || '<div class="empty">Пока нет прохождений</div>';

  $('#content').classList.remove('hide');
}

fetch('stats.json', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(render)
  .catch((err) => {
    $('#sub').textContent = 'Данные ещё не опубликованы (' + err.message + ')';
  });
</script>
</body>
</html>
